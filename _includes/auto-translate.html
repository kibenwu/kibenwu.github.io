<!-- Auto Translate (Google Website Translator) -->
<!--
  行为：
  - 中文（默认）不加载任何第三方脚本，零额外请求
  - 点 English / 日本語 → 写 googtrans cookie 后重载，Google 挂件接管
  - cookie 天然跨页面保持，读者切一次，后续文章沿用
  - 首次访问且浏览器语言非中文 → 自动切到对应语言（仅一次）
  - 代码块、行内代码打 notranslate，不参与翻译
-->

<style>
.lang-bar {
  margin: 15px 0 5px;
  font-size: 13px;
  line-height: 1.8;
}
.lang-bar .lang-bar-label {
  color: #999;
  margin-right: 6px;
}
.lang-bar a {
  display: inline-block;
  padding: 1px 9px;
  margin-right: 4px;
  color: #337ab7;
  border: 1px solid #337ab7;
  border-radius: 3px;
  text-decoration: none !important;
  background: #fff;
}
.lang-bar a:hover {
  color: #fff;
  background: #337ab7;
}
.lang-bar a.active {
  color: #fff;
  background: #337ab7;
  cursor: default;
}
.lang-bar .lang-bar-hint {
  display: none;
  margin-left: 4px;
  color: #aaa;
}
.lang-bar.is-translated .lang-bar-hint {
  display: inline;
}

/* 藏掉 Google 自己的顶栏与挂件，避免顶部被推下来 */
#google_translate_element { display: none !important; }
.goog-te-banner-frame,
.goog-te-gadget-icon { display: none !important; }
iframe.skiptranslate { display: none !important; }
body { top: 0 !important; position: static !important; }
.goog-tooltip, .goog-tooltip:hover { display: none !important; }
.goog-text-highlight { background: none !important; box-shadow: none !important; }
</style>

<div class="lang-bar" id="lang-bar">
  <span class="lang-bar-label">Language</span>
  <a href="#" data-lang="zh">中文</a>
  <a href="#" data-lang="en">English</a>
  <a href="#" data-lang="ja">日本語</a>
  <span class="lang-bar-hint">机翻，仅供参考 / machine-translated</span>
</div>

<div id="google_translate_element"></div>

<script>
(function () {
  var SOURCE = 'zh-CN';
  var SUPPORTED = ['en', 'ja'];
  var COOKIE = 'googtrans';

  function readCookie(name) {
    var m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return m ? decodeURIComponent(m.pop()) : '';
  }

  function writeCookie(name, value) {
    var base = name + '=' + value + ';path=/';
    if (value === '') {
      document.cookie = base + ';expires=Thu, 01 Jan 1970 00:00:01 GMT';
      document.cookie = base + ';expires=Thu, 01 Jan 1970 00:00:01 GMT;domain=' + location.hostname;
    } else {
      document.cookie = base;
    }
  }

  // cookie 形如 /zh-CN/en
  function currentLang() {
    var v = readCookie(COOKIE);
    var target = v ? v.split('/')[2] : '';
    return SUPPORTED.indexOf(target) > -1 ? target : 'zh';
  }

  function setLang(lang) {
    if (lang === currentLang()) return;
    try { localStorage.setItem('langPicked', '1'); } catch (e) {}
    if (lang === 'zh') {
      writeCookie(COOKIE, '');
    } else {
      writeCookie(COOKIE, '/' + SOURCE + '/' + lang);
    }
    location.reload();
  }

  function browserPreferred() {
    var list = navigator.languages || [navigator.language || ''];
    for (var i = 0; i < list.length; i++) {
      var tag = (list[i] || '').toLowerCase();
      if (tag.indexOf('zh') === 0) return null;      // 中文读者不动
      if (tag.indexOf('ja') === 0) return 'ja';
      if (tag.indexOf('en') === 0) return 'en';
    }
    return null;
  }

  function markNoTranslate() {
    var sel = 'pre, code, kbd, samp, tt, .highlight, .highlighter-rouge, .lineno';
    var nodes = document.querySelectorAll(sel);
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].classList.add('notranslate');
      nodes[i].setAttribute('translate', 'no');
    }
  }

  function loadWidget() {
    window.googleTranslateElementInit = function () {
      new google.translate.TranslateElement({
        pageLanguage: SOURCE,
        includedLanguages: SUPPORTED.join(','),
        autoDisplay: false
      }, 'google_translate_element');
    };
    var s = document.createElement('script');
    s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
    s.async = true;
    document.body.appendChild(s);

    // 挂件有时会给 body 加 top 偏移，压掉它
    var fix = setInterval(function () {
      if (document.body.style.top && document.body.style.top !== '0px') {
        document.body.style.top = '0px';
      }
    }, 300);
    setTimeout(function () { clearInterval(fix); }, 8000);
  }

  function init() {
    var bar = document.getElementById('lang-bar');
    if (!bar) return;

    var lang = currentLang();

    // 首次访问按浏览器语言自动切一次
    if (lang === 'zh') {
      var picked = false;
      try { picked = !!localStorage.getItem('langPicked'); } catch (e) {}
      var tried = false;
      try { tried = !!sessionStorage.getItem('langAutoTried'); } catch (e) {}
      if (!picked && !tried) {
        try { sessionStorage.setItem('langAutoTried', '1'); } catch (e) {}
        var guess = browserPreferred();
        if (guess) {
          writeCookie(COOKIE, '/' + SOURCE + '/' + guess);
          location.reload();
          return;
        }
      }
    }

    var links = bar.querySelectorAll('a[data-lang]');
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      if (a.getAttribute('data-lang') === lang) a.classList.add('active');
      a.addEventListener('click', function (e) {
        e.preventDefault();
        setLang(this.getAttribute('data-lang'));
      });
    }

    if (lang !== 'zh') {
      bar.classList.add('is-translated');
      markNoTranslate();
      loadWidget();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
