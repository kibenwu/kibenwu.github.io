<!-- Auto Translate (Google Website Translator) -->
<!--
  行为：
  - 中文（默认）不加载任何第三方脚本，零额外请求
  - 点 English / 日本語 → 写 googtrans cookie 后重载，Google 挂件接管
  - cookie 天然跨页面保持，读者切一次，后续文章沿用
  - 首次访问根据访问者 IP 地理位置自动切语言（日本→日文，中国→中文，其他→英文）
  - 同时保留浏览器语言检测作为 fallback
  - 手动点击语言链接后写入 langPicked，后续不再自动切换
  - 代码块、行内代码打 notranslate，不参与翻译
-->

<style>
.lang-bar {
  margin: 15px 0 5px;
  font-size: 13px;
  line-height: 1.8;
}
.lang-bar .lang-bar-label {
  color: #999;
  margin-right: 6px;
}
.lang-bar a {
  display: inline-block;
  padding: 1px 9px;
  margin-right: 4px;
  color: #337ab7;
  border: 1px solid #337ab7;
  border-radius: 3px;
  text-decoration: none !important;
  background: #fff;
}
.lang-bar a:hover {
  color: #fff;
  background: #337ab7;
}
.lang-bar a.active {
  color: #fff;
  background: #337ab7;
  cursor: default;
}
.lang-bar .lang-bar-hint {
  display: none;
  margin-left: 4px;
  color: #aaa;
}
.lang-bar.is-translated .lang-bar-hint {
  display: inline;
}

/* 藏掉 Google 自己的顶栏与挂件，避免顶部被推下来 */
#google_translate_element { display: none !important; }
.goog-te-banner-frame,
.goog-te-gadget-icon { display: none !important; }
iframe.skiptranslate { display: none !important; }
body { top: 0 !important; position: static !important; }
.goog-tooltip, .goog-tooltip:hover { display: none !important; }
.goog-text-highlight { background: none !important; box-shadow: none !important; }
</style>

<div class="lang-bar" id="lang-bar">
  <span class="lang-bar-label">Language</span>
  <a href="#" data-lang="zh">中文</a>
  <a href="#" data-lang="en">English</a>
  <a href="#" data-lang="ja">日本語</a>
  <span class="lang-bar-hint">机翻，仅供参考 / machine-translated</span>
</div>

<div id="google_translate_element"></div>

<script>
(function () {
  var SOURCE = 'zh-CN';
  var SUPPORTED = ['en', 'ja'];
  var COOKIE = 'googtrans';

  /* sessionStorage / localStorage 键名 */
  var KEY_PICKED    = 'langPicked';       // localStorage — 用户已手动选过语言
  var KEY_IP_TRIED  = 'langIpTried';      // sessionStorage — 本次会话已尝试过 IP 检测
  var KEY_IP_LANG   = 'langIpResult';     // sessionStorage — IP 检测结果缓存

  function readCookie(name) {
    var m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return m ? decodeURIComponent(m.pop()) : '';
  }

  function writeCookie(name, value) {
    var base = name + '=' + value + ';path=/';
    if (value === '') {
      document.cookie = base + ';expires=Thu, 01 Jan 1970 00:00:01 GMT';
      document.cookie = base + ';expires=Thu, 01 Jan 1970 00:00:01 GMT;domain=' + location.hostname;
    } else {
      document.cookie = base;
    }
  }

  // cookie 形如 /zh-CN/en
  function currentLang() {
    var v = readCookie(COOKIE);
    var target = v ? v.split('/')[2] : '';
    return SUPPORTED.indexOf(target) > -1 ? target : 'zh';
  }

  function setLang(lang) {
    if (lang === currentLang()) return;
    try { localStorage.setItem(KEY_PICKED, '1'); } catch (e) {}
    if (lang === 'zh') {
      writeCookie(COOKIE, '');
    } else {
      writeCookie(COOKIE, '/' + SOURCE + '/' + lang);
    }
    location.reload();
  }

  /*
   * 浏览器语言检测（fallback）
   * 返回 'ja' / 'en' / null（中文或无法判断时返回 null）
   */
  function browserPreferred() {
    var list = navigator.languages || [navigator.language || ''];
    for (var i = 0; i < list.length; i++) {
      var tag = (list[i] || '').toLowerCase();
      if (tag.indexOf('zh') === 0) return null;      // 中文读者不动
      if (tag.indexOf('ja') === 0) return 'ja';
      if (tag.indexOf('en') === 0) return 'en';
    }
    return null;
  }

  /*
   * IP 地理位置检测
   * 使用免费 API（ipapi.co），不需要 key
   * 日本 → 'ja'，中国 → null（中文是默认语言，不需要翻译），其他 → 'en'
   * 带 sessionStorage 缓存，同一次会话只请求一次
   * 超时 3 秒，失败则 fallback 到浏览器语言检测
   */
  function detectCountryLang() {
    return new Promise(function (resolve) {
      /* 先查 sessionStorage 缓存 */
      try {
        var cached = sessionStorage.getItem(KEY_IP_LANG);
        if (cached) {
          resolve(cached === 'null' ? null : cached);
          return;
        }
      } catch (e) {}

      var done = false;
      var timer = setTimeout(function () {
        if (!done) { done = true; resolve(null); }
      }, 3000);

      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://ipapi.co/json/', true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (done) return;
        done = true;
        clearTimeout(timer);

        var lang = null;
        try {
          if (xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            var cc = (data.country_code || '').toUpperCase();

            if (cc === 'JP') {
              lang = 'ja';          // 日本 → 日文
            } else if (cc === 'CN' || cc === 'HK' || cc === 'TW' || cc === 'MO') {
              lang = null;          // 中国及港澳台 → 中文（默认语言，不翻译）
            } else {
              lang = 'en';          // 其他地区 → 英文
            }

            /* 缓存到 sessionStorage */
            try { sessionStorage.setItem(KEY_IP_LANG, lang || 'null'); } catch (e) {}
          }
        } catch (e) {
          /* JSON 解析失败，fallback 到浏览器语言 */
          lang = browserPreferred();
        }
        resolve(lang);
      };
      xhr.onerror = function () {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve(browserPreferred());
      };
      xhr.send();
    });
  }

  function markNoTranslate() {
    var sel = 'pre, code, kbd, samp, tt, .highlight, .highlighter-rouge, .lineno';
    var nodes = document.querySelectorAll(sel);
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].classList.add('notranslate');
      nodes[i].setAttribute('translate', 'no');
    }
  }

  function loadWidget() {
    window.googleTranslateElementInit = function () {
      new google.translate.TranslateElement({
        pageLanguage: SOURCE,
        includedLanguages: SUPPORTED.join(','),
        autoDisplay: false
      }, 'google_translate_element');
    };
    var s = document.createElement('script');
    s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
    s.async = true;
    document.body.appendChild(s);

    // 挂件有时会给 body 加 top 偏移，压掉它
    var fix = setInterval(function () {
      if (document.body.style.top && document.body.style.top !== '0px') {
        document.body.style.top = '0px';
      }
    }, 300);
    setTimeout(function () { clearInterval(fix); }, 8000);
  }

  /*
   * 渲染语言栏 + 加载翻译挂件（与 IP 检测无关的 UI 逻辑）
   */
  function renderBar() {
    var bar = document.getElementById('lang-bar');
    if (!bar) return;

    var lang = currentLang();

    var links = bar.querySelectorAll('a[data-lang]');
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      if (a.getAttribute('data-lang') === lang) a.classList.add('active');
      a.addEventListener('click', function (e) {
        e.preventDefault();
        setLang(this.getAttribute('data-lang'));
      });
    }

    if (lang !== 'zh') {
      bar.classList.add('is-translated');
      markNoTranslate();
      loadWidget();
    }
  }

  /*
   * 初始化主流程：
   * 1. 如果用户已手动选过语言（localStorage 有 langPicked）→ 直接渲染，不做任何自动检测
   * 2. 如果已设了 googtrans cookie（之前自动切过或手动切过）→ 直接渲染
   * 3. 首次访问（无 cookie、无 langPicked）→ IP 地理位置检测 → 自动设语言
   * 4. IP 检测失败 → fallback 到浏览器语言检测
   */
  function init() {
    var lang = currentLang();
    var picked = false;
    try { picked = !!localStorage.getItem(KEY_PICKED); } catch (e) {}
    var ipTried = false;
    try { ipTried = !!sessionStorage.getItem(KEY_IP_TRIED); } catch (e) {}

    /* 用户已手动选过语言，或已有翻译 cookie → 不再自动检测 */
    if (picked || lang !== 'zh' || ipTried) {
      renderBar();
      return;
    }

    /* 首次访问，启动 IP 地理位置检测 */
    try { sessionStorage.setItem(KEY_IP_TRIED, '1'); } catch (e) {}

    detectCountryLang().then(function (guess) {
      if (guess) {
        /* 检测到需要翻译 → 写 cookie 并重载，Google 挂件接管 */
        writeCookie(COOKIE, '/' + SOURCE + '/' + guess);
        location.reload();
      } else {
        /* 检测结果为中文（中国访客）或检测失败 → 保持默认中文，直接渲染 */
        renderBar();
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
