<!-- Mermaid rendering (opt-in via front matter: mermaid: true) -->
<!--
  行为：
  - 把 kramdown/rouge 产出的 ```mermaid 代码块转成图
  - 兼容 rouge 的行号 table 布局（取 td.code pre 的纯文本）
  - 图源里写的是浅色系（为了 GitHub / 编辑器预览好看），
    渲染前按下面的色表整体换成本站深色版（css/custom.css 纯黑金），
    所以 .md 文件本身不需要为深色主题改动。
  - 色表只做「hex → hex」替换，因此 flowchart 的 classDef、
    xychart / pie / quadrant 的 themeVariables 一次全覆盖。
  - 示意图定位：图只是正文描述的辅助，不承担强调。所以渲染前
    剥掉图源里的 <b> / <strong>（全部按常规字重排），字号比正文小一档。
    图源里的原句一字不改，只改字重与字号。
-->

<style>
.mermaid-figure {
  margin: 1.6rem 0;
  text-align: center;
  overflow-x: auto;
}
.mermaid-figure svg {
  max-width: 100%;
  height: auto;
}
/* 示意图不用粗体：mermaid 自己会给 cluster 标题、边标签等加字重 */
.mermaid-figure svg text,
.mermaid-figure svg tspan,
.mermaid-figure .nodeLabel,
.mermaid-figure .edgeLabel,
.mermaid-figure .cluster-label,
.mermaid-figure foreignObject div,
.mermaid-figure foreignObject span,
.mermaid-figure foreignObject p {
  font-weight: 400 !important;
}
</style>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

  /* 浅色图源 → 站内深色。语义不变：琥珀＝判据 / 红＝危险 / 绿＝安全 / 灰＝中性 */
  var DARK = {
    /* 中性面与线 */
    '#ffffff': '#0a0a0a',   /* 画布底 / pie 扇形描边 */
    '#fafaf8': '#101010',   /* cluster 底 */
    '#fbfbf9': '#121212',   /* gap 填充 / secondary / tertiary */
    '#f7f7f4': '#121212',   /* quadrant-3 底 */
    '#f4f4f1': '#1a1a1a',   /* base 填充 / primaryColor */
    '#e6e6e0': '#242424',   /* pie3 */
    '#d4d4cc': '#2f2f2f',   /* cluster 边 */
    '#c9c9c1': '#3a3a3a',   /* gap 边 / 刻度 */
    '#a8a8a0': '#4a4a4a',   /* base 边 / 轴线 */
    '#b0b0a8': '#5a5a5a',   /* 连线 */
    '#55554f': '#8a8a8a',   /* 轴标签 / 图例 */
    '#77776f': '#8a8a8a',   /* gap 文字 */
    '#33332f': '#c8c8c8',   /* 正文 */
    /* 琥珀 · 判据 / 关键结论 */
    '#fdf6d9': '#2a2410',
    '#b8952a': '#fed136',
    '#c9a227': '#fed136',
    '#5f4a06': '#ffe6a0',
    /* 红 · 危险 / 反例 */
    '#fdeeea': '#2a1512',
    '#f0d6cd': '#3a1d18',
    '#d9522f': '#e0664a',
    '#8f2c12': '#ffb3a0',
    /* 绿 · 安全 / 增长 */
    '#ecfaf0': '#12251b',
    '#eff7f2': '#12251b',
    '#2f9c66': '#4fbf82',
    '#14603c': '#a8e8c2'
  };

  var DARK_RE = new RegExp(Object.keys(DARK).join('|'), 'gi');

  function toDark(src) {
    return src.replace(DARK_RE, function (hex) {
      return DARK[hex.toLowerCase()] || hex;
    });
  }

  /* 示意图只做示意：不加粗，字号比正文小一档。原句不动。 */
  function toPlain(src) {
    return src
      .replace(/<\/?(?:b|strong)>/gi, '')
      .replace(/"fontSize":"14px"/g, '"fontSize":"12px"')
      .replace(/"pieTitleTextSize":"17px"/g, '"pieTitleTextSize":"14px"');
  }

  function sourceOf(box) {
    var codeCell = box.querySelector('td.code pre');
    var node = codeCell || box.querySelector('code') || box;
    return node.textContent.replace(/\s+$/, '');
  }

  /* ------------------------------------------------------------------
     图内文案的多语言：Google 挂件不碰 SVG 文本，而且译文变长会撑破
     mermaid 算好的框，所以这里在**渲染前**换掉图源，让 mermaid 按译文
     重新测量排版。词表：js/fig-i18n/<slug>.js，缺条目回落中文。
     ------------------------------------------------------------------ */
  var SLUG = '{{ page.slug }}';
  var HAS_DICT = {% if page.figi18n %}true{% else %}false{% endif %};
  var LANGS = { en: 0, ja: 1 };

  function currentLang() {
    var m = document.cookie.match('(^|;)\\s*googtrans\\s*=\\s*([^;]+)');
    if (!m) return null;
    var parts = decodeURIComponent(m.pop()).split('/');
    var lang = parts[parts.length - 1];
    return lang in LANGS ? lang : null;
  }

  function loadDict(slug) {
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = '{{ site.baseurl }}/js/fig-i18n/' + slug + '.js';
      s.onload = function () { resolve((window.FIG_I18N || {})[slug] || null); };
      s.onerror = function () { resolve(null); };
      document.head.appendChild(s);
    });
  }

  function makeTranslator(dict, lang) {
    var idx = LANGS[lang];
    function tr(s) {
      var hit = dict[s.trim()];
      return hit && hit[idx] ? hit[idx] : s;
    }
    /* 只有命中词表的文本才会被换掉，没命中的一律原样留下 */
    return function (src) {
      return src.split('\n').map(function (line) {
        if (line.indexOf('%%{init') >= 0) return line;

        /* 1. 带引号的标签："..." */
        var out = line.replace(/"([^"]*)"/g, function (m, s) {
          return s ? '"' + tr(s) + '"' : m;
        });

        /* 2. 不带引号的节点标签：[...] (...) {...} ([...]) ((...)) */
        out = out.replace(
          /([\[\(\{]+)([^\[\]\(\){}"|]*[\u4e00-\u9fff][^\[\]\(\){}"|]*)([\]\)\}]+)/g,
          function (m, open, text, close) { return open + tr(text) + close; }
        );

        /* 3. 边上的文字：-.文字.-> / --文字--> / ==文字==> / |文字| */
        out = out
          .replace(/-\.([^.>|"]*[\u4e00-\u9fff][^.>|"]*)\.->/g, function (m, s) { return '-.' + tr(s) + '.->'; })
          .replace(/--([^->|"]*[\u4e00-\u9fff][^->|"]*)-->/g, function (m, s) { return '--' + tr(s) + '-->'; })
          .replace(/==([^=>|"]*[\u4e00-\u9fff][^=>|"]*)==>/g, function (m, s) { return '==' + tr(s) + '==>'; })
          .replace(/\|([^|"]*[\u4e00-\u9fff][^|"]*)\|/g, function (m, s) { return '|' + tr(s) + '|'; });

        /* 4. title / section 行（不加引号的写法） */
        var m = out.match(/^(\s*)(title|section)\s+(.+)$/);
        if (m && m[3].indexOf('"') < 0) return m[1] + m[2] + ' ' + tr(m[3]);

        /* 5. timeline 的事件行：年份 : 事件 : 事件 */
        if (out.indexOf('"') < 0 && out.indexOf(':') > 0 && /[\u4e00-\u9fff]/.test(out)) {
          var indent = out.match(/^\s*/)[0];
          return indent + out.trim().split(':').map(function (seg) { return tr(seg); }).join(' : ');
        }
        return out;
      }).join('\n');
    };
  }

  var lang = currentLang();
  var dict = lang && HAS_DICT ? await loadDict(SLUG) : null;
  var toLang = dict ? makeTranslator(dict, lang) : function (s) { return s; };

  var boxes = document.querySelectorAll(
    '.post-container div.language-mermaid, .post-container pre > code.language-mermaid'
  );

  var figures = [];
  boxes.forEach(function (box) {
    var target = box.tagName === 'CODE' ? box.parentNode : box;
    var fig = document.createElement('div');
    fig.className = 'mermaid-figure notranslate';
    fig.textContent = toPlain(toDark(toLang(sourceOf(box))));
    target.parentNode.replaceChild(fig, target);
    figures.push(fig);
  });

  if (figures.length) {
    mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });
    await mermaid.run({ nodes: figures });
  }
</script>
